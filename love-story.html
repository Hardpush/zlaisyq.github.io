<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        /* 浪漫背景图 */
        body {
            background-image: url('images/2/2025-02-01 222922.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        /* 半透明遮罩 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: -1;
        }
        
        /* 时间线样式 */
        .timeline-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px;
        }
        
        .timeline-line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #f43f5e 0%, #a855f7 100%);
            border-radius: 2px;
            z-index: 1;
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 60px;
            width: 100%;
        }
        
        .timeline-content-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
        }
        
        .timeline-item:nth-child(odd) .timeline-content-wrapper {
            flex-direction: row;
        }
        
        .timeline-item:nth-child(even) .timeline-content-wrapper {
            flex-direction: row-reverse;
        }
        
        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.2);
            z-index: 10;
        }
        
        .timeline-content {
            width: 45%;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        /* 图片样式 */
        .timeline-image {
            width: 45%;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .timeline-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .timeline-image:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .timeline-date {
            display: inline-block;
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .timeline-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 12px;
            font-family: 'Dancing Script', cursive;
        }
        
        .timeline-text {
            color: #6b7280;
            line-height: 1.8;
            font-size: 16px;
        }
        
        .timeline-mood {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #f43f5e;
            font-size: 14px;
            margin-top: 12px;
        }
        
        /* 返回按钮样式 */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-button:hover {
            background: #e11d48;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .timeline-container {
                padding: 15px;
                padding-top: 80px;
            }
            
            .timeline-line {
                left: 20px;
            }
            
            .timeline-dot {
                left: 20px;
            }
            
            .timeline-item:nth-child(odd) .timeline-content,
            .timeline-item:nth-child(even) .timeline-content {
                margin-left: 50px;
                margin-right: 0;
                padding-left: 30px;
                padding-right: 20px;
                width: calc(100% - 50px);
            }
            
            .timeline-content {
                padding: 20px;
            }
            
            .timeline-image {
                display: none;
            }
            
            .timeline-title {
                font-size: 20px;
            }
            
            .timeline-text {
                font-size: 15px;
            }
            
            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 16px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .timeline-container {
                padding: 10px;
                padding-top: 70px;
            }
            
            .timeline-line {
                left: 15px;
            }
            
            .timeline-dot {
                left: 15px;
                width: 16px;
                height: 16px;
            }
            
            .timeline-item:nth-child(odd) .timeline-content,
            .timeline-item:nth-child(even) .timeline-content {
                margin-left: 40px;
                width: calc(100% - 40px);
                padding-left: 20px;
                padding-right: 15px;
            }
            
            .timeline-content {
                padding: 16px;
            }
            
            .timeline-title {
                font-size: 18px;
            }
            
            .timeline-text {
                font-size: 14px;
                line-height: 1.6;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .timeline-item {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(6) { animation-delay: 0.6s; }
        .timeline-item:nth-child(7) { animation-delay: 0.7s; }
    </style>
</head>

    <script>
        // 音乐播放器功能
        function initMusicPlayer() {
            console.log('🎵 开始初始化音乐播放器...');
            
            const audio = document.getElementById('background-music');
            const playBtn = document.getElementById('music-play-btn');
            
            if (!audio || !playBtn) {
                console.error('❌ 音乐播放器元素未找到');
                return;
            }
            
            // 设置音量
            audio.volume = 0.3;
            
            // 播放状态管理
            let isPlaying = false;
            
            // 播放/暂停功能
            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-music text-xl"></i>';
                    console.log('⏸️  音乐已暂停');
                } else {
                    audio.play().then(() => {
                        playBtn.innerHTML = '<i class="fas fa-pause text-xl"></i>';
                        console.log('▶️  音乐已开始播放');
                    }).catch(err => {
                        console.error('❌ 音乐播放失败:', err);
                    });
                }
                isPlaying = !isPlaying;
            });
            
            // 添加键盘快捷键（M键）
            document.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'm' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    playBtn.click();
                }
            });
            
            // 添加加载完成事件监听
            audio.addEventListener('loadedmetadata', () => {
                console.log('🎵 音乐文件已加载完成');
            });
            
            // 添加错误事件监听
            audio.addEventListener('error', (err) => {
                console.error('🎵 音乐加载失败:', err);
                playBtn.title = '音乐加载失败，请检查文件路径';
            });
            
            // 添加循环播放结束事件
            audio.addEventListener('ended', () => {
                console.log('🔄 音乐循环播放');
                audio.currentTime = 0;
                audio.play();
            });
            
            console.log('✅ 音乐播放器初始化完成');
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}年${month}月${day}日`;
        }

        // 获取心情图标
        function getMoodIcon(mood) {
            const moodIcons = {
                '甜蜜': 'fa-heart',
                '兴奋': 'fa-star',
                '幸福': 'fa-smile-o',
                '浪漫': 'fa-moon',
                '理解': 'fa-handshake-o',
                '激动': 'fa-diamond',
                '感动': 'fa-sun'
            };
            return moodIcons[mood] || 'fa-heart';
        }

        // 从love-records文件加载内容
        async function loadContentFromFile(fileName) {
            try {
                const response = await fetch(`love-records/${fileName}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                // 将文本转换为HTML格式，保留换行
                return text.replace(/\n/g, '<br>');
            } catch (error) {
                console.error('加载文件失败:', error);
                return '内容加载失败';
            }
        }

        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            console.log('开始渲染时间线，共', loveStoryData.length, '项');
            
            loveStoryData.forEach((item, index) => {
                console.log('渲染第', index+1, '项:', item.title, '图片:', item.image);
                
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                // 构建内容HTML
                let html = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-content-wrapper">
                        <div class="timeline-content">
                            <div class="timeline-date">${formatDate(item.date)}</div>
                            <div class="timeline-title">${item.title}</div>
                            <div class="timeline-text">加载中...</div>
                            <div class="timeline-mood">
                                <i class="fa ${getMoodIcon(item.mood)}"></i>
                                <span>${item.mood}</span>
                            </div>
                        </div>
                `;
                
                // 如果有图片，添加图片元素
                if (item.image) {
                    console.log('添加图片:', item.image);
                    html += `
                        <div class="timeline-image" style="display: block; width: 45%; height: 300px;">
                            <img src="${item.image}" alt="${item.title}" style="display: block; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    `;
                }
                
                html += `</div>`;
                timelineItem.innerHTML = html;
                container.appendChild(timelineItem);
                
                // 加载内容
                if (item.fileName) {
                    loadContentFromFile(item.fileName).then(content => {
                        const textElement = timelineItem.querySelector('.timeline-text');
                        if (textElement) {
                            textElement.innerHTML = content;
                        }
                    });
                }
            });
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            initMusicPlayer();
            renderTimeline();
        });
    </script>
